title: Vilmos Horváth
baseurl: "/portfolio"
url: "https://vilok-vii.github.io"

collections:
  projects:
    output: true

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      section: projects
      permalink: /projects/:name/
      scripts: ["project.js"]

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
