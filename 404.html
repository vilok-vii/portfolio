<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script>
		// Old links from when the site had /en/ and /hu/ versions: send them to the same page without the prefix
		(function () {
			var base = "{{ '/' | relative_url }}";
			var rest = location.pathname.slice(base.length);
			if (location.pathname.indexOf(base) === 0 && /^(en|hu)(\/|$)/.test(rest)) {
				location.replace(base + rest.replace(/^(en|hu)\/?/, "") + location.hash);
			}
		})();
		try {
			if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark";
		} catch (e) {}
	</script>
	<title>Page not found — Vilmos Horváth</title>
	<link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
</head>
<body>
	<main class="container page">
		<div class="welcome">
			<h1>Page not found</h1>
			<p><a href="{{ '/' | relative_url }}">Go to the home page</a></p>
		</div>
	</main>
</body>
</html>
