---
layout: default
---
{%- assign t = site.data.text -%}
	<main class="container page">
		<div class="about">
			<img class="ph" src="{{ '/assets/images/about/portrait.webp' | relative_url }}" alt="{{ t.about.portrait }}" width="900" height="953">
			<div class="about__body">
				<h1>{{ t.about.title }}</h1>
				<p>{{ t.about.bio_1 }}</p>
				<p>{{ t.about.bio_2 }}</p>
				<h2 class="label">{{ t.about.skills }}</h2>
				<ul class="tags">
					<li>{{ t.about.skill }}</li>
					<li>{{ t.about.skill }}</li>
					<li>{{ t.about.skill }}</li>
					<li>{{ t.about.skill }}</li>
				</ul>
				<h2 class="label">{{ t.about.contact }}</h2>
				<p>{{ t.about.email }}</p>
			</div>
		</div>
	</main>
